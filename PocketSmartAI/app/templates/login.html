{% extends "base.html" %}

{% block title %}
Login · PocketSmart AI
{% endblock %}


{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <p class="eyebrow">
            WELCOME BACK
        </p>

        <h1>
            Login
        </h1>

        <p class="muted">
            Continue planning with PocketSmart AI.
        </p>


        <form id="login-form">


            <label>

                Email

                <input
                    name="email"
                    type="email"
                    required
                    autocomplete="email"
                >

            </label>


            <label>

                Password

                <input
                    name="password"
                    type="password"
                    required
                    autocomplete="current-password"
                >

            </label>


            <button
                type="submit"
                class="btn primary full"
            >
                Login
            </button>


            <p
                id="form-message"
                class="message"
            ></p>


        </form>


        <p class="muted">

            Don't have an account?

            <a href="/register">
                Create one
            </a>

        </p>

    </div>

</div>

{% endblock %}


{% block scripts %}

<script>

document
    .getElementById("login-form")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const form =
                new FormData(event.target);

            const body =
                Object.fromEntries(form);

            const response =
                await api(
                    "/api/auth/login",
                    {
                        method: "POST",
                        body: JSON.stringify(body)
                    }
                );

            if (response.ok) {

                window.location.href =
                    "/dashboard";

                return;
            }

            showMessage(
                await errorText(response)
            );
        }
    );

</script>

{% endblock %}
