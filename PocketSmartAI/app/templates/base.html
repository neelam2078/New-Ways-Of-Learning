<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        PocketSmart AI
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

<header class="navbar">

    <a
        href="/"
        class="logo"
    >
        PocketSmart
        <span>AI</span>
    </a>

    <nav>

        {% if user %}

        <a href="/dashboard">
            Dashboard
        </a>

        <a href="/history">
            History
        </a>

        <a href="/planner/home">
            Home
        </a>

        <a href="/planner/party">
            Party
        </a>

        <a href="/planner/jewelry">
            Jewelry
        </a>

        <button
            class="nav-button"
            onclick="logout()"
        >
            Logout
        </button>

        {% else %}

        <a href="/login">
            Login
        </a>

        <a
            href="/register"
            class="nav-cta"
        >
            Get Started
        </a>

        {% endif %}

    </nav>

</header>


<main class="container">

    {% block content %}
    {% endblock %}

</main>


<footer class="footer">

    <p>
        PocketSmart AI
        ·
        Budget-aware AI recommendations
    </p>

</footer>


<script src="/static/js/app.js"></script>

{% block scripts %}
{% endblock %}

</body>

</html>
